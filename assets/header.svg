<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-labelledby="title desc">
  <title id="title">LuoLan</title>
  <desc id="desc">Windows apps and open source. A hand-drawn meadow with soft clouds and little paw prints.</desc>
  <defs>
    <style>
      svg { --paper:#fff8e9; --ink:#514334; --muted:#675749; --edge:#d1c4a8; --rule:#d4c7ad; --sky:#b9ebf2; --sky-pale:#d8f2f1; --cloud:#fffbee; --far:#b0cd79; --near:#88ad56; --grass:#638746; --paw:#52683b; --margin:#83a870; }
      @media (prefers-color-scheme:dark) {
        svg { --paper:#2b2c25; --ink:#fbefd9; --muted:#ded0b6; --edge:#555b47; --rule:#6a6a55; --sky:#304e58; --sky-pale:#3a5357; --cloud:#bddad9; --far:#566b43; --near:#3c5536; --grass:#9db87a; --paw:#d2dbab; --margin:#9eb785; }
      }
      .breeze { animation:breeze 10s ease-in-out infinite; }
      @keyframes breeze { 50% { transform:translateX(9px); } }
      @media (prefers-reduced-motion:reduce) { .breeze { animation:none; } }
      text { font-family:"Segoe Print","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif; }
    </style>
    <path id="page" d="M21 13Q222 7 433 11T860 10Q872 11 872 26L873 222Q871 237 856 236Q649 241 431 236T26 238Q10 236 10 222L8 29Q7 16 21 13Z"/>
    <clipPath id="pageClip"><use href="#page"/></clipPath>
    <linearGradient id="sky" x2="1" y2=".32">
      <stop offset=".39" stop-color="var(--paper)"/>
      <stop offset=".72" stop-color="var(--sky-pale)"/>
      <stop offset="1" stop-color="var(--sky)"/>
    </linearGradient>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 .5h28" stroke="var(--rule)" stroke-opacity=".25"/>
    </pattern>
    <g id="paw" fill="var(--paw)">
      <path d="M-8 5c.2-3 4-7 8-7 4.3-.3 8.3 4 8.4 7.2.2 4-3.8 4-8.4 2.4C-3.8 9.1-8.5 9.2-8 5Z"/>
      <ellipse cx="-9" cy="-3" rx="2.8" ry="3.6" transform="rotate(-24 -9 -3)"/>
      <ellipse cx="-3" cy="-8" rx="2.6" ry="3.5" transform="rotate(-12 -3 -8)"/>
      <ellipse cx="3.6" cy="-8" rx="2.6" ry="3.5" transform="rotate(12 3.6 -8)"/>
      <ellipse cx="9" cy="-3.3" rx="2.6" ry="3.5" transform="rotate(28 9 -3.3)"/>
    </g>
  </defs>
  <use href="#page" transform="translate(1 3)" fill="var(--edge)" opacity=".52"/>
  <g clip-path="url(#pageClip)">
    <rect width="880" height="248" fill="url(#sky)"/>
    <rect width="880" height="248" fill="url(#paper)"/>
    <path d="M32 12q-2 111 1 228" fill="none" stroke="var(--margin)" stroke-width="1.6" opacity=".61"/>

    <g class="breeze" fill="var(--cloud)" opacity=".88">
      <path d="M510 84c7-13 18-17 34-13 5-17 18-25 35-24 14-1 26 7 30 17 13-4 27 2 32 12 12 0 22 5 23 11-15 6-54 5-75 6-34 1-64-1-82-3Z"/>
      <path d="M719 51c3-9 14-13 25-10 4-10 13-15 24-13 10 1 18 7 20 12 12-2 25 1 32 10 7 0 13 3 16 7-16 5-98 4-121 1Z" opacity=".75"/>
    </g>
    <path d="M449 238c70-21 110-62 189-84 69-19 110-43 188-46 19-.9 36-2 54-5v145H443Z" fill="var(--far)"/>
    <path d="M543 249c68-10 129-31 177-60 52-31 106-40 160-46v105Z" fill="var(--near)"/>
    <g fill="none" stroke="var(--grass)" stroke-width="2" stroke-linecap="round" opacity=".83">
      <path d="M516 224l-5-5m7 5 2-8m85-19-4-6m6 7 2-9m57-28-4-5m6 5 2-7m150 38-6-6m9 6 1-8m-70 40-4-5m7 4 2-7m71-76-3-5m6 5 2-6"/>
      <path d="M803 214q8-3 17-4m-216 19 13-5m119-85 12-3" opacity=".5"/>
    </g>
    <g opacity=".87">
      <use href="#paw" transform="translate(635 216) rotate(31) scale(.87)"/>
      <use href="#paw" transform="translate(674 190) rotate(34) scale(.82)"/>
      <use href="#paw" transform="translate(708 177) rotate(40) scale(.76)"/>
      <use href="#paw" transform="translate(748 153) rotate(45) scale(.7)"/>
    </g>
    <g stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M732 111q-6-10-15-8 1 11 13 11-7 3-6 10 9 0 11-10 8 9 14 3-3-9-11-8 7-8 1-13-9 3-7 15Z" fill="#f4d98b"/>
      <path d="m730 118 8-11m-2 3 6-2" fill="none"/>
    </g>
  </g>
  <use href="#page" fill="none" stroke="var(--edge)" stroke-width="1.6"/>

  <text x="58" y="53" font-size="16" font-weight="700" fill="var(--muted)">@luolangaga</text>
  <path d="M59 60q52 3 110-1" stroke="var(--margin)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <text x="53" y="128" font-size="63" font-weight="700" fill="var(--ink)" letter-spacing="-1.8">LuoLan</text>
  <path d="M58 141q91 3 194-2m-180 9q62-1 133-3" fill="none" stroke="var(--margin)" stroke-width="3.2" stroke-linecap="round"/>
  <text x="58" y="178" font-size="24" font-weight="700" fill="var(--ink)">Windows apps &amp; open source</text>
  <text x="58" y="214" font-size="17" font-weight="700" fill="var(--muted)">C#  ·  .NET  ·  WinUI 3</text>
</svg>
